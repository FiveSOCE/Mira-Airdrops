name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraAirdrops-0.1.0
          path: build/libs/MiraAirdrops-0.1.0.jar
          if-no-files-found: error

      - name: Publish v0.1.0 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 \
              build/libs/MiraAirdrops-0.1.0.jar \
              --target "${{ github.sha }}" \
              --title "MiraAirdrops v0.1.0" \
              --notes "Initial MiraAirdrops release: randomized 20-50 falling supply crates, per-crate 1-5 item loot rolls, MiraFactions Warzone or captured WorldEdit regions, MiraCore guaranteed reward delivery, inbound/start/remaining/completion messaging, persistent event-until-found behavior, auto scheduling, and full in-game GUI administration."
          fi
