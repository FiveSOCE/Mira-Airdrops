name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraAirdrops-0.1.2
          path: build/libs/MiraAirdrops-0.1.2.jar
          if-no-files-found: error

      - name: Publish v0.1.2 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.2 >/dev/null 2>&1; then
            gh release create v0.1.2 \
              build/libs/MiraAirdrops-0.1.2.jar \
              --target "${{ github.sha }}" \
              --title "MiraAirdrops v0.1.2" \
              --notes "Release-ready hardening build: persistent active/inbound events across restarts, PDC-marked protected crates, safe reward queueing, improved MiraFactions WarZone sampling, MiraCore audit integration, standard Mira broadcasts, command tab completion, and finalized 0.1.2 metadata."
          fi
