config-version: 1

event:
  auto-enabled: false
  interval-minutes: 120
  inbound-seconds: 30
  min-crates: 20
  max-crates: 50
  min-loot-items: 1
  max-loot-items: 5
  max-placement-attempts-per-crate: 250

region:
  mode: WARZONE
  warzone-world: world
  worldedit:
    world: ""
    min-x: 0
    min-y: -64
    min-z: 0
    max-x: 0
    max-y: 319
    max-z: 0
    configured: false

messages:
  inbound: "&6&lAirdrop &8>> &fAn airdrop is inbound in &e%seconds%s&f!"
  started: "&6&lAirdrop &8>> &fAirdrop active! &e%total% &fsupply crates have dropped."
  remaining: "&6&lAirdrop &8>> &e%remaining%&7/&e%total% &fsupply crates remain."
  complete: "&6&lAirdrop &8>> &aAll supply crates have been found!"
  cancelled: "&6&lAirdrop &8>> &cThe active airdrop has been cancelled."
  claim-prefix: "&6&lAirdrop &8>> &aYou found: "
  overflow: "&6&lAirdrop &8>> &eSome rewards did not fit and were moved to &f/rewards&e."
