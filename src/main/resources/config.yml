config-version: 2

event:
  auto-enabled: false
  interval-minutes: 120
  inbound-seconds: 30
  min-crates: 20
  max-crates: 50
  min-loot-items: 1
  max-loot-items: 5
  max-placement-attempts-per-crate: 250

region:
  mode: WARZONE
  warzone-world: world
  # MiraFactions WarZone sampling first checks around world spawn so a normal-sized
  # WarZone is not lost inside Minecraft's enormous default world border.
  warzone-search-radius: 1500
  warzone-search-attempts: 2000
  worldedit:
    world: ""
    min-x: 0
    min-y: -64
    min-z: 0
    max-x: 0
    max-y: 319
    max-z: 0
    configured: false

messages:
  inbound: "&fAn airdrop is inbound in &e%seconds%s&f!"
  started: "&fAirdrop active! &e%total% &fsupply crates have dropped."
  remaining: "&e%remaining%&7/&e%total% &fsupply crates remain."
  complete: "&aAll supply crates have been found!"
  cancelled: "&cThe active airdrop has been cancelled."
  claim-prefix: "&aYou found: "
  overflow: "&eSome rewards did not fit and were moved to &f/rewards&e."
